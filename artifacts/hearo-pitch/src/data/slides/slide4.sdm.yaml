format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#0F172A"
elements:
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 180
      stops:
        - offset: 0.0009
          color:
            kind: rgb
            value: "#FFFFFF"
          opacity: 0.03
        - offset: 0.0009
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
  - id: shape2
    type: shape
    frame:
      x: 576
      y: 156
      width: 768
      height: 768
    geometry:
      kind: preset
      preset: ellipse
    fill:
      kind: solid
      color:
        kind: rgb
        value: "#14B8A6"
    opacity: 0.055
  - id: shape3
    type: shape
