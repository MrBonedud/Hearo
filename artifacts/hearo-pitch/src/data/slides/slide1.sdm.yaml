format: replit.sdm
version: 1
size: { width: 1920, height: 1080 }
background: { kind: solid, color: { kind: rgb, value: "#0F172A" } }
assets:
  iso: { src: images/iso.png }
elements:
  - id: glow
    type: shape
    frame: { x: 1250, y: 260, width: 576, height: 576 }
    geometry: { kind: preset, preset: ellipse }
    fill: { kind: solid, color: { kind: rgb, value: "#14B8A6" }, opacity: 0.083 }
  - id: isoImage
    type: image
    frame: { x: 1180, y: 330, width: 700, height: 382 }
    assetId: iso
    altText: Isometric 3D data dashboard illustration
    fit: contain
  - id: accentBar
    type: shape
    frame: { x: 96, y: 170, width: 77, height: 6 }
    geometry: { kind: preset, preset: roundRect }
    fill: { kind: solid, color: { kind: rgb, value: "#14B8A6" }, opacity: 1 }
  - id: kicker
    type: text
    frame: { x: 96, y: 50, width: 900, height: 80 }
    body:
      verticalAlign: top
      paragraphs:
        - runs:
            - text: "HEARO  ·  1 / 5"
          defaultRunStyle:
            font: { kind: family, family: DM Sans }
            sizePt: 14.4
            weight: 700
            color: { kind: rgb, value: "#14B8A6" }
          lineHeight: 1.35
          spaceAfterPt: 14
  - id: headline
    type: text
    frame: { x: 96, y: 196, width: 1060, height: 300 }
    body:
      verticalAlign: top
      paragraphs:
        - runs:
            - text: "Hearo — يصغي، لا يلقّن"
          defaultRunStyle:
            font: { kind: family, family: Cairo }
            sizePt: 50
            weight: 700
            color: { kind: rgb, value: "#FFFFFF" }
          lineHeight: 1.3
          spaceAfterPt: 14
  - id: body
    type: text
    frame: { x: 96, y: 500, width: 1100, height: 510 }
    body:
      verticalAlign: top
      paragraphs:
        - runs:
            - text: "Reading can feel like understanding. Explaining in your own words exposes the gaps. Hearo silently checks against your reference; any subject is the vision, System Design is this demo."
          defaultRunStyle:
            font: { kind: family, family: Inter }
            sizePt: 21
            weight: 400
            color: { kind: rgb, value: "#94A3B8" }
          lineHeight: 1.45
          spaceAfterPt: 14
  - id: footRule
    type: shape
    frame: { x: 96, y: 988, width: 1728, height: 1 }
    geometry: { kind: preset, preset: rect }
    fill: { kind: solid, color: { kind: rgb, value: "#FFFFFF" }, opacity: 0.1 }
