openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: study
    description: Reference-grounded spoken study
paths:
  /study/allowance:
    get:
      operationId: getStudyAllowance
      tags: [study]
      summary: Read this signed browser session's daily allowance without running AI
      responses:
        "200":
          description: Session allowance and shared-service availability; never other sessions' usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyAllowance"
        "503":
          description: Allowance storage or session signing is unavailable
  /study/demo:
    get:
      operationId: getDemoSource
      tags: [study]
      summary: Get the fixed English lecture source and AI availability
      responses:
        "200":
          description: Source metadata and verbatim excerpts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSource"
  /study/demo/upload:
    post:
      operationId: uploadDemoPdf
      tags: [study]
      summary: Verify the exact approved PDF without storing it
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Verified source with a two-hour study authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedDemoSource"
        "400":
          description: Different or corrupt PDF
        "413":
          description: File exceeds the approved file size
        "415":
          description: Unsupported file type
  /study/messages:
    post:
      operationId: sendDemoMessage
      tags: [study]
      summary: Run an authored Arabic demo through the agreed final-sentence event path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoBrowserMessage"
      responses:
        "200":
          description: Shared topic pack and ordered browser events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoMessageResponse"
        "400":
          description: Invalid message or unsupported topic
        "404":
          description: Session expired or does not exist
        "409":
          description: Session ended or sentence identifier was reused with different text
        "429":
          description: Demo session or sentence limit reached
  /verify:
    post:
      operationId: verifyDemoSentence
      tags: [study]
      summary: Deterministic authored-demo verification of one final sentence, not general AI checking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoVerifyInput"
      responses:
        "200":
          description: Sentence-linked claims with validated exact source evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoVerifyResult"
        "400":
          description: Invalid final sentence or unsupported topic
  /report:
    post:
      operationId: reportDemoSession
      tags: [study]
      summary: Recompute the authored-demo report from the whole final-sentence session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoReportInput"
      responses:
        "200":
          description: Arabic report with score breakdown, gaps, errors, strengths, and review questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoReport"
        "400":
          description: Invalid session or unsupported topic
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /study/prepare:
    post:
      operationId: prepareStudy
      tags: [study]
      summary: Build a concept map from study material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySourceInput"
      responses:
        "200":
          description: Concept map based on the supplied reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyMap"
        "400":
          description: Invalid study material
        "503":
          description: AI provider is unavailable
  /study/evaluate:
    post:
      operationId: evaluateStudy
      description: |
        Paid checks reserve one session and overall allowance before any provider call.
        Limits are 30 checks per signed browser session and 500 overall per UTC day.
        Failed provider attempts consume allowance. Storage failures fail closed.
      tags: [study]
      summary: Check the learner's explanation against the reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyEvaluationInput"
      responses:
        "429":
          description: Daily allowance exhausted, or short cooldown/in-flight guard.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry (provided for daily budget exhaustion).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyCheckError"
        "503":
          description: Checker or persistent budget storage unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyCheckError"
        "200":
          description: Updated concept map and claim feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyEvaluation"
        "400":
          description: Invalid evaluation request
components:
  schemas:
    StudyAllowance:
      type: object
      required: [remainingChecks, dailyLimit, resetAt, available]
      properties:
        remainingChecks:
          type: integer
          minimum: 0
          description: Remaining reservations for this browser session, including failed paid attempts
        dailyLimit:
          type: integer
          minimum: 1
        resetAt:
          type: string
          format: date-time
          description: Next midnight UTC, measured by the database
        available:
          type: boolean
          description: Both this session and the shared service have allowance at the time of reading
        blockedBy:
          type: string
          enum: [session, overall]
    StudyCheckError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [evaluation_budget_exceeded, evaluation_budget_unavailable]
        scope:
          type: string
          enum: [session, overall]
        retryAt:
          type: string
          format: date-time
        retryAfterSeconds:
          type: integer
    DemoEvidence:
      type: object
      properties:
        line_id: { type: integer, minimum: 1 }
        quote: { type: string, minLength: 1 }
      required: [line_id, quote]
    DemoVerdict:
      type: string
      enum: [supported, contradicts, unverified]
    DemoConceptState:
      type: string
      enum: [grey, green, red, amber]
    DemoReferenceLine:
      type: object
      properties:
        line_id: { type: integer }
        text: { type: string }
      required: [line_id, text]
    DemoConcept:
      type: object
      properties:
        id: { type: string }
        label_ar: { type: string }
        label_en: { type: string }
        aliases: { type: string }
        must_cover: { type: boolean }
        supporting_lines:
          type: array
          items: { type: integer }
        dependencies:
          type: array
          items: { type: string }
        gap_question: { type: string }
        x: { type: number }
        y: { type: number }
      required: [id, label_ar, label_en, aliases, must_cover, supporting_lines, dependencies, gap_question, x, y]
    DemoMisconception:
      type: object
      properties:
        concept_id: { type: string }
        wrong_claim: { type: string }
        correction: { type: string }
        source_line_id: { type: integer }
      required: [concept_id, wrong_claim, correction, source_line_id]
    DemoTopicPack:
      type: object
      properties:
        id: { type: string }
        title_ar: { type: string }
        title_en: { type: string }
        reference_lines:
          type: array
          items:
            $ref: "#/components/schemas/DemoReferenceLine"
        concepts:
          type: array
          items:
            $ref: "#/components/schemas/DemoConcept"
        misconceptions:
          type: array
          items:
            $ref: "#/components/schemas/DemoMisconception"
      required: [id, title_ar, title_en, reference_lines, concepts, misconceptions]
    DemoStartMessage:
      type: object
      properties:
        type: { type: string, enum: [start] }
        topic_id: { type: string, enum: [system-design] }
      required: [type, topic_id]
    DemoTextMessage:
      type: object
      properties:
        type: { type: string, enum: [text] }
        session_id: { type: string, format: uuid }
        sentence_id: { type: string, minLength: 1, maxLength: 100 }
        text: { type: string, minLength: 1, maxLength: 2000 }
      required: [type, session_id, sentence_id, text]
    DemoStopMessage:
      type: object
      properties:
        type: { type: string, enum: [stop] }
        session_id: { type: string, format: uuid }
      required: [type, session_id]
    DemoBrowserMessage:
      oneOf:
        - $ref: "#/components/schemas/DemoStartMessage"
        - $ref: "#/components/schemas/DemoTextMessage"
        - $ref: "#/components/schemas/DemoStopMessage"
    DemoVerifyInput:
      type: object
      properties:
        topic_id: { type: string, enum: [system-design] }
        sentence_id: { type: string, minLength: 1, maxLength: 100 }
        sentence: { type: string, minLength: 1, maxLength: 2000 }
        previous_sentences:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 2000 }
      required: [topic_id, sentence_id, sentence, previous_sentences]
    DemoClaim:
      type: object
      properties:
        concept_id: { type: string }
        verdict:
          $ref: "#/components/schemas/DemoVerdict"
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence:
          oneOf:
            - $ref: "#/components/schemas/DemoEvidence"
            - type: "null"
        correction: { type: ["string", "null"] }
      required: [concept_id, verdict, confidence, evidence, correction]
    DemoVerifyResult:
      type: object
      properties:
        sentence_id: { type: string }
        claims:
          type: array
          items:
            $ref: "#/components/schemas/DemoClaim"
      required: [sentence_id, claims]
    DemoFinalSentence:
      type: object
      properties:
        sentence_id: { type: string, minLength: 1, maxLength: 100 }
        sentence: { type: string, minLength: 1, maxLength: 2000 }
      required: [sentence_id, sentence]
    DemoReportInput:
      type: object
      properties:
        topic_id: { type: string, enum: [system-design] }
        sentences:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/DemoFinalSentence"
      required: [topic_id, sentences]
    DemoReportGap:
      type: object
      properties:
        concept_id: { type: string }
        label: { type: string }
        state:
          $ref: "#/components/schemas/DemoConceptState"
        question: { type: string }
      required: [concept_id, label, state, question]
    DemoReportError:
      type: object
      properties:
        sentence_id: { type: string }
        concept_id: { type: string }
        statement: { type: string }
        correction: { type: string }
        evidence:
          $ref: "#/components/schemas/DemoEvidence"
        resolved: { type: boolean }
      required: [sentence_id, concept_id, statement, correction, evidence, resolved]
    DemoReportStrength:
      type: object
      properties:
        concept_id: { type: string }
        label: { type: string }
      required: [concept_id, label]
    DemoReviewQuestion:
      type: object
      properties:
        concept_id: { type: string }
        question: { type: string }
      required: [concept_id, question]
    DemoReport:
      type: object
      properties:
        score: { type: number, minimum: 0, maximum: 100 }
        coverage: { type: number, minimum: 0, maximum: 1 }
        accuracy: { type: number, minimum: 0, maximum: 1 }
        covered_count: { type: integer, minimum: 0 }
        must_cover_count: { type: integer, minimum: 0 }
        correct_count: { type: integer, minimum: 0 }
        assessed_count: { type: integer, minimum: 0 }
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/DemoReportGap"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/DemoReportError"
        strengths:
          type: array
          items:
            $ref: "#/components/schemas/DemoReportStrength"
        self_corrections:
          type: array
          items:
            $ref: "#/components/schemas/DemoReportStrength"
        review_questions:
          type: array
          items:
            $ref: "#/components/schemas/DemoReviewQuestion"
        tomorrow_question: { type: string }
      required: [score, coverage, accuracy, covered_count, must_cover_count, correct_count, assessed_count, gaps, errors, strengths, self_corrections, review_questions, tomorrow_question]
    DemoSentenceEvent:
      type: object
      properties:
        type: { type: string, enum: [sentence] }
        session_id: { type: string }
        sentence_id: { type: string }
        text: { type: string }
      required: [type, session_id, sentence_id, text]
    DemoClaimEvent:
      type: object
      properties:
        type: { type: string, enum: [claim] }
        session_id: { type: string }
        sentence_id: { type: string }
        claim:
          $ref: "#/components/schemas/DemoClaim"
      required: [type, session_id, sentence_id, claim]
    DemoConceptStateEvent:
      type: object
      properties:
        type: { type: string, enum: [concept_state] }
        session_id: { type: string }
        sentence_id: { type: ["string", "null"] }
        concept_id: { type: string }
        state:
          $ref: "#/components/schemas/DemoConceptState"
      required: [type, session_id, sentence_id, concept_id, state]
    DemoReportEvent:
      type: object
      properties:
        type: { type: string, enum: [report] }
        session_id: { type: string }
        report:
          $ref: "#/components/schemas/DemoReport"
      required: [type, session_id, report]
    DemoErrorEvent:
      type: object
      properties:
        type: { type: string, enum: [error] }
        session_id: { type: ["string", "null"] }
        message: { type: string }
      required: [type, session_id, message]
    DemoEvent:
      oneOf:
        - $ref: "#/components/schemas/DemoSentenceEvent"
        - $ref: "#/components/schemas/DemoClaimEvent"
        - $ref: "#/components/schemas/DemoConceptStateEvent"
        - $ref: "#/components/schemas/DemoReportEvent"
        - $ref: "#/components/schemas/DemoErrorEvent"
    DemoMessageResponse:
      type: object
      properties:
        session_id: { type: string }
        topic_pack:
          $ref: "#/components/schemas/DemoTopicPack"
        events:
          type: array
          items:
            $ref: "#/components/schemas/DemoEvent"
      required: [session_id, topic_pack, events]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudyNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [understood, incorrect, skipped]
        evidence:
          type: ["string", "null"]
      required: [id, label, description, status, evidence]
    StudyEdge:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        label:
          type: string
      required: [from, to, label]
    StudyMap:
      type: object
      properties:
        topic:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/StudyNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/StudyEdge"
      required: [topic, nodes, edges]
    StudySourceInput:
      type: object
      properties:
        sourceToken:
          type: string
        topic:
          type: string
          minLength: 1
          maxLength: 120
        referenceText:
          type: string
          minLength: 80
          maxLength: 30000
      required: [topic, referenceText]
    StudyEvaluationInput:
      type: object
      properties:
        sourceToken:
          type: string
        topic:
          type: string
          minLength: 1
          maxLength: 120
        referenceText:
          type: string
          minLength: 80
          maxLength: 30000
        transcript:
          type: string
          minLength: 1
          maxLength: 12000
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/StudyNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/StudyEdge"
      required: [topic, referenceText, transcript, nodes, edges]
    StudyFeedback:
      type: object
      properties:
        statement:
          type: string
        status:
          type: string
          enum: [understood, incorrect]
        explanation:
          type: string
      required: [statement, status, explanation]
    StudyEvaluation:
      type: object
      properties:
        assessments:
          type: array
          items:
            $ref: "#/components/schemas/ConceptAssessment"
        topic:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/StudyNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/StudyEdge"
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/StudyFeedback"
      required: [topic, nodes, edges, feedback]
    SourceLine:
      type: object
      properties:
        id: { type: string }
        page: { type: integer, minimum: 1 }
        text: { type: string }
      required: [id, page, text]
    DemoSource:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        filename: { type: string }
        downloadUrl: { type: string }
        byteLength: { type: integer }
        pageCount: { type: integer }
        scope: { type: string }
        referenceText: { type: string }
        referenceLines:
          type: array
          items:
            $ref: "#/components/schemas/SourceLine"
        aiAvailable: { type: boolean }
      required: [id, title, author, filename, downloadUrl, byteLength, pageCount, scope, referenceText, referenceLines, aiAvailable]
    VerifiedDemoSource:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/DemoSource"
        sourceToken: { type: string }
      required: [source, sourceToken]
    ConceptAssessment:
      type: object
      properties:
        conceptId: { type: string }
        verdict:
          type: string
          enum: [supported, partially_understood, contradicted, not_demonstrated]
        studentEvidence:
          type: ["string", "null"]
        sourceLineIds:
          type: array
          items: { type: string }
        confidence:
          type: string
          enum: [low, medium, high]
        explanation: { type: string }
        followUp: { type: string }
      required: [conceptId, verdict, studentEvidence, sourceLineIds, confidence, explanation, followUp]
    AssessmentResult:
      type: object
      properties:
        assessments:
          type: array
          items:
            $ref: "#/components/schemas/ConceptAssessment"
      required: [assessments]

